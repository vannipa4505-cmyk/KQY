<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านค้าออนไลน์ VIP (พร้อมระบบหลังบ้าน)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; }
    
    /* แถบเมนูด้านบน */
    nav { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    nav h1 { font-size: 1.4rem; color: #38bdf8; }
    .user-info { display: flex; align-items: center; gap: 0.5rem; }
    .balance-box { background: #0f172a; border: 1px solid #38bdf8; padding: 0.4rem 0.8rem; border-radius: 6px; color: #38bdf8; font-weight: bold; }
    .btn { border: none; padding: 0.5rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
    .topup-btn { background: #10b981; } .topup-btn:hover { background: #059669; }
    .code-btn { background: #8b5cf6; } .code-btn:hover { background: #7c3aed; }
    .admin-btn { background: #ef4444; } .admin-btn:hover { background: #dc2626; }

    /* ส่วนแสดงสินค้า */
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .card { background: #1e293b; border-radius: 10px; border: 1px solid #334155; overflow: hidden; padding: 1rem; text-align: center; }
    .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
    .card-title { font-size: 1.1rem; margin: 0.8rem 0; font-weight: bold; }
    .card-price { color: #38bdf8; font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; }
    .buy-btn { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 0.6rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .buy-btn:hover { background: #0284c7; color: white; }

    /* หน้าต่าง Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; width: 90%; max-width: 450px; text-align: center; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 10px; right: 15px; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
    .form-input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 0.9rem; }
    .confirm-btn { width: 100%; color: white; border: none; padding: 0.7rem; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 0.5rem; }
    .bg-green { background: #10b981; } .bg-purple { background: #8b5cf6; } .bg-red { background: #ef4444; }

    /* ตารางและลิสต์ในหลังบ้าน */
    .admin-section { text-align: left; margin-top: 1rem; border-top: 1px solid #334155; padding-top: 1rem; }
    .item-list { list-style: none; padding: 0; margin-top: 0.5rem; }
    .item-list li { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 0.5rem 0.8rem; border-radius: 6px; margin-bottom: 0.4rem; font-size: 0.85rem; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- แถบด้านบน -->
  <nav>
    <h1>🛒 Store VIP</h1>
    <div class="user-info">
      <div class="balance-box">เครดิต: <span id="user-balance">0</span> ฿</div>
      <button class="btn code-btn" onclick="toggleModal('code-modal', true)">🎁 โค้ด</button>
      <button class="btn topup-btn" onclick="toggleModal('topup-modal', true)">💳 เติมเงิน</button>
      <button class="btn admin-btn" onclick="openAdminModal()">⚙️ หลังบ้าน</button>
    </div>
  </nav>

  <!-- หน้าแสดงรายการสินค้า -->
  <div class="container">
    <h2>🔥 สินค้า ทั้งหมด</h2>
    <div class="grid" id="product-grid">
      <!-- สินค้าจะถูกสร้างอัตโนมัติจากสคริปต์ -->
    </div>
  </div>

  <!-- Pop-up เติมเงิน -->
  <div id="topup-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="toggleModal('topup-modal', false)">&times;</span>
      <h3 style="margin-bottom: 0.5rem; color: #38bdf8;">💳 เติมเงิน TrueMoney อั่งเปา</h3>
      <p style="font-size: 0.85rem; color: #94a3b8;">วางลิงก์ซองอั่งเปาเพื่อรับเครดิตทันที</p>
      <input type="text" id="voucher-url" class="form-input" placeholder="https://gift.truemoney.com/v1/?v=...">
      <button id="btn-topup-submit" class="confirm-btn bg-green" onclick="processTopup()">ยืนยันการเติมเงิน</button>
    </div>
  </div>

  <!-- Pop-up ใส่โค้ด -->
  <div id="code-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="toggleModal('code-modal', false)">&times;</span>
      <h3 style="margin-bottom: 0.5rem; color: #a855f7;">🎁 ระบบแลกโค้ดรางวัล</h3>
      <input type="text" id="gift-code" class="form-input" placeholder="กรอก Code ตรงนี้">
      <button class="confirm-btn bg-purple" onclick="processCode()">ยืนยันการใช้โค้ด</button>
    </div>
  </div>

  <!-- Pop-up ล็อกอินหลังบ้าน -->
  <div id="admin-login-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="toggleModal('admin-login-modal', false)">&times;</span>
      <h3 style="margin-bottom: 0.5rem; color: #ef4444;">🔒 เข้าสู่ระบบหลังบ้าน</h3>
      <input type="password" id="admin-pass-input" class="form-input" placeholder="กรอกรหัสผ่านหลังบ้าน">
      <button class="confirm-btn bg-red" onclick="loginAdmin()">เข้าสู่ระบบ</button>
    </div>
  </div>

  <!-- Pop-up แผงควบคุมหลังบ้าน (Admin Dashboard) -->
  <div id="admin-dashboard-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="toggleModal('admin-dashboard-modal', false)">&times;</span>
      <h3 style="color: #ef4444;">⚙️ จัดการระบบหลังบ้าน</h3>
      
      <!-- ตั้งค่าเบอร์รับเงิน -->
      <div class="admin-section">
        <h4>📞 เบอร์ TrueMoney Wallet รับเงิน</h4>
        <input type="text" id="admin-phone-input" class="form-input" placeholder="08xxxxxxxx">
        <button class="confirm-btn bg-green" onclick="saveAdminPhone()">บันทึกเบอร์</button>
      </div>

      <!-- เพิ่มสินค้า -->
      <div class="admin-section">
        <h4>➕ เพิ่ม/จัดการ สินค้า</h4>
        <input type="text" id="new-prod-title" class="form-input" placeholder="ชื่อสินค้า">
        <input type="number" id="new-prod-price" class="form-input" placeholder="ราคาสินค้า (บาท)">
        <input type="text" id="new-prod-img" class="form-input" placeholder="ลิงก์รูปภาพ (Optional)">
        <button class="confirm-btn bg-green" onclick="addProduct()">เพิ่มสินค้า</button>
        <ul id="admin-prod-list" class="item-list"></ul>
      </div>

      <!-- เพิ่มโค้ดส่วนลด -->
      <div class="admin-section">
        <h4>🎁 เพิ่ม/จัดการ โค้ดส่วนลด</h4>
        <input type="text" id="new-code-name" class="form-input" placeholder="ชื่อโค้ด (เช่น FREE20)">
        <input type="number" id="new-code-amount" class="form-input" placeholder="จำนวนเครดิตที่จะแจก">
        <button class="confirm-btn bg-purple" onclick="addDiscountCode()">เพิ่มโค้ด</button>
        <ul id="admin-code-list" class="item-list"></ul>
      </div>

    </div>
  </div>

  <script>
    // ⚙️ ตั้งค่ารหัสผ่านหลังบ้านตรงนี้ (เปลี่ยนรหัสผ่านตามต้องการ)
    const ADMIN_PASSWORD = "admin1234";

    // ข้อมูลเริ่มต้นในระบบ
    let walletPhone = localStorage.getItem('wallet_phone') || "0812345678";
    let products = JSON.parse(localStorage.getItem('products')) || [
      { id: 1, title: 'สคริปต์ Blox Fruits VIP', price: 50, img: 'https://via.placeholder.com/300x180/16213e/ffffff?text=Blox+Fruits' },
      { id: 2, title: 'ไอดีเกม Free Fire ตลับเทพ', price: 150, img: 'https://via.placeholder.com/300x180/0f3460/ffffff?text=Free+Fire' }
    ];
    let promoCodes = JSON.parse(localStorage.getItem('promo_codes')) || [
      { code: 'FREE10', amount: 10 },
      { code: 'VIP50', amount: 50 }
    ];

    let balance = Number(localStorage.getItem('user_balance')) || 0;
    document.getElementById('user-balance').innerText = balance.toLocaleString();

    // แสดงรายการสินค้าหน้าเว็บ
    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      products.forEach(p => {
        grid.innerHTML += `
          <div class="card">
            <img src="${p.img}" alt="${p.title}">
            <div class="card-title">${p.title}</div>
            <div class="card-price">฿${p.price}</div>
            <button class="buy-btn" onclick="buyProduct('${p.title}', ${p.price})">สั่งซื้อสินค้า</button>
          </div>
        `;
      });
    }
    renderProducts();

    function updateBalance(amount) {
      balance += amount;
      localStorage.setItem('user_balance', balance);
      document.getElementById('user-balance').innerText = balance.toLocaleString();
    }

    function toggleModal(id, show) {
      const modal = document.getElementById(id);
      if (show) modal.classList.add('active');
      else modal.classList.remove('active');
    }

    // เติมเงิน
    async function processTopup() {
      const voucherInput = document.getElementById('voucher-url').value.trim();
      const btn = document.getElementById('btn-topup-submit');
      if (!voucherInput) return alert('กรุณากรอกลิงก์ซองก่อนครับ!');

      let voucherCode = voucherInput.includes('v=') ? voucherInput.split('v=')[1].split('&')[0] : voucherInput;
      btn.innerText = "กำลังตรวจสอบ..."; btn.disabled = true;

      try {
        const response = await fetch(`https://truemoney-gift-api.vercel.app/api/redeem`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: walletPhone, voucher_hash: voucherCode })
        });
        const resData = await response.json();
        if (response.ok && resData.status === 'SUCCESS') {
          updateBalance(Number(resData.amount));
          alert(`🎉 เติมเงินสำเร็จ! ได้รับเครดิต ฿${resData.amount}`);
          toggleModal('topup-modal', false);
          document.getElementById('voucher-url').value = '';
        } else {
          alert(`❌ เติมเงินไม่สำเร็จ: ${resData.message || 'ซองไม่ถูกต้อง/โดนใช้ไปแล้ว'}`);
        }
      } catch (err) {
        alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบเติมเงิน');
      } finally {
        btn.innerText = "ยืนยันการเติมเงิน"; btn.disabled = false;
      }
    }

    // กรอกโค้ด
    function processCode() {
      const inputCode = document.getElementById('gift-code').value.trim().toUpperCase();
      const found = promoCodes.find(c => c.code === inputCode);
      if (found) {
        updateBalance(found.amount);
        alert(`🎉 ยินดีด้วย! คุณได้รับเครดิตฟรี ${found.amount} บาท`);
        toggleModal('code-modal', false);
      } else {
        alert('❌ โค้ดไม่ถูกต้อง หรือไม่มีในระบบ!');
      }
      document.getElementById('gift-code').value = '';
    }

    // ซื้อสินค้า
    function buyProduct(name, price) {
      if (balance < price) {
        alert(`❌ เครดิตไม่พอสำหรับซื้อ ${name} (ต้องการ ฿${price})`);
      } else {
        updateBalance(-price);
        alert(`🎉 สั่งซื้อ ${name} สำเร็จ! หักเครดิต ฿${price}`);
      }
    }

    /* --- ⚙️ ระบบหลังบ้าน (ADMIN SYSTEM) --- */
    function openAdminModal() {
      toggleModal('admin-login-modal', true);
    }

    function loginAdmin() {
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === ADMIN_PASSWORD) {
        toggleModal('admin-login-modal', false);
        document.getElementById('admin-pass-input').value = '';
        document.getElementById('admin-phone-input').value = walletPhone;
        renderAdminLists();
        toggleModal('admin-dashboard-modal', true);
      } else {
        alert('❌ รหัสผ่านหลังบ้านไม่ถูกต้อง!');
      }
    }

    function saveAdminPhone() {
      walletPhone = document.getElementById('admin-phone-input').value.trim();
      localStorage.setItem('wallet_phone', walletPhone);
      alert('✅ บันทึกเบอร์รับเงินสำเร็จ!');
    }

    function renderAdminLists() {
      // รายการสินค้าในหลังบ้าน
      const prodList = document.getElementById('admin-prod-list');
      prodList.innerHTML = '';
      products.forEach((p, index) => {
        prodList.innerHTML += `<li><span>${p.title} - ฿${p.price}</span><button class="del-btn" onclick="deleteProduct(${index})">ลบ</button></li>`;
      });

      // รายการโค้ดในหลังบ้าน
      const codeList = document.getElementById('admin-code-list');
      codeList.innerHTML = '';
      promoCodes.forEach((c, index) => {
        codeList.innerHTML += `<li><span>${c.code} (+฿${c.amount})</span><button class="del-btn" onclick="deleteCode(${index})">ลบ</button></li>`;
      });
    }

    function addProduct() {
      const title = document.getElementById('new-prod-title').value.trim();
      const price = Number(document.getElementById('new-prod-price').value);
      let img = document.getElementById('new-prod-img').value.trim() || 'https://via.placeholder.com/300x180/16213e/ffffff?text=Product';

      if (!title || price <= 0) return alert('กรุณากรอกข้อมูลสินค้าให้ครบถ้วน!');
      products.push({ id: Date.now(), title, price, img });
      localStorage.setItem('products', JSON.stringify(products));
      renderProducts();
      renderAdminLists();
      document.getElementById('new-prod-title').value = ''; document.getElementById('new-prod-price').value = '';
    }

    function deleteProduct(index) {
      products.splice(index, 1);
      localStorage.setItem('products', JSON.stringify(products));
      renderProducts();
      renderAdminLists();
    }

    function addDiscountCode() {
      const code = document.getElementById('new-code-name').value.trim().toUpperCase();
      const amount = Number(document.getElementById('new-code-amount').value);
      if (!code || amount <= 0) return alert('กรุณากรอกข้อมูลโค้ดให้ครบถ้วน!');

      promoCodes.push({ code, amount });
      localStorage.setItem('promo_codes', JSON.stringify(promoCodes));
      renderAdminLists();
      document.getElementById('new-code-name').value = ''; document.getElementById('new-code-amount').value = '';
    }

    function deleteCode(index) {
      promoCodes.splice(index, 1);
      localStorage.setItem('promo_codes', JSON.stringify(promoCodes));
      renderAdminLists();
    }
  </script>

</body>
  </html>
