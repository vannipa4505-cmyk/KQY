<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบร้านค้าออนไลน์ + หลังบ้าน</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; }
    
    /* Navigation Bar */
    nav { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    nav h1 { font-size: 1.4rem; color: #38bdf8; }
    .nav-btns button { background: #334155; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 0.5rem; transition: 0.2s; }
    .nav-btns button:hover { background: #475569; }
    .nav-btns button.active { background: #0284c7; }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .page { display: none; }
    .page.active { display: block; }

    /* Shop Page Styles */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
    .card { background: #1e293b; border-radius: 10px; border: 1px solid #334155; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card-body { padding: 1rem; }
    .card-title { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .card-price { color: #38bdf8; font-size: 1.25rem; font-weight: bold; margin-bottom: 1rem; }
    .buy-btn { width: 100%; background: #10b981; color: white; border: none; padding: 0.6rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .buy-btn:hover { background: #059669; }

    /* Admin Page Styles */
    .admin-card { background: #1e293b; padding: 1.5rem; border-radius: 10px; border: 1px solid #334155; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; }
    .form-group input { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    .submit-btn { background: #0284c7; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #334155; color: #cbd5e1; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
    .del-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <nav>
    <h1>🛒 Online Store</h1>
    <div class="nav-btns">
      <button id="btn-shop" class="active" onclick="switchPage('shop')">หน้าร้านค้า</button>
      <button id="btn-admin" onclick="switchPage('admin')">🛠️ หลังบ้าน (Admin)</button>
    </div>
  </nav>

  <div class="container">
    
    <!-- หน้าบ้าน: ร้านค้า -->
    <div id="page-shop" class="page active">
      <h2 style="margin-bottom: 1.5rem;">รายการสินค้าทั้งหมด</h2>
      <div id="shop-grid" class="grid"></div>
    </div>

    <!-- หน้าหลังบ้าน: จัดการสินค้า -->
    <div id="page-admin" class="page">
      <div class="admin-card">
        <h3 style="margin-bottom: 1rem;">➕ เพิ่มสินค้าใหม่เข้าระบบ</h3>
        <form id="add-form">
          <div class="form-group">
            <label>ชื่อสินค้า</label>
            <input type="text" id="p-name" placeholder="ระบุชื่อสินค้า" required>
          </div>
          <div class="form-group">
            <label>ราคา (บาท)</label>
            <input type="number" id="p-price" placeholder="ระบุราคา" required>
          </div>
          <div class="form-group">
            <label>URL รูปภาพสินค้า</label>
            <input type="text" id="p-img" placeholder="https://example.com/image.png">
          </div>
          <button type="submit" class="submit-btn">บันทึกสินค้า</button>
        </form>
      </div>

      <h3>📦 ตารางจัดการสินค้าหลังบ้าน</h3>
      <br>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ชื่อสินค้า</th>
            <th>ราคา</th>
            <th>การจัดการ</th>
          </tr>
        </thead>
        <tbody id="admin-table"></tbody>
      </table>
    </div>

  </div>

  <script>
    // ฐานข้อมูลจำลองในเครื่องผู้ใช้ (LocalStorage)
    let products = JSON.parse(localStorage.getItem('my_products')) || [
      { id: 1, name: "ไอดีเกม / สคริปต์ VIP", price: 150, img: "https://via.placeholder.com/300x180/16213e/ffffff?text=Product+1" },
      { id: 2, name: "สินค้าตัวอย่าง B", price: 300, img: "https://via.placeholder.com/300x180/0f3460/ffffff?text=Product+2" }
    ];

    function saveProducts() {
      localStorage.setItem('my_products', JSON.stringify(products));
    }

    // สลับหน้าระหว่าง Shop / Admin
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));
      
      document.getElementById('page-' + page).classList.add('active');
      document.getElementById('btn-' + page).classList.add('active');
    }

    // โหลดข้อมูลสินค้ามาแสดงผล
    function renderProducts() {
      // แสดงหน้าบ้าน
      const shopGrid = document.getElementById('shop-grid');
      shopGrid.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.name}">
          <div class="card-body">
            <div class="card-title">${p.name}</div>
            <div class="card-price">฿${Number(p.price).toLocaleString()}</div>
            <button class="buy-btn" onclick="alert('สั่งซื้อ ${p.name} สำเร็จ!')">สั่งซื้อสินค้า</button>
          </div>
        </div>
      `).join('');

      // แสดงตารางหลังบ้าน
      const adminTable = document.getElementById('admin-table');
      adminTable.innerHTML = products.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td>฿${Number(p.price).toLocaleString()}</td>
          <td><button class="del-btn" onclick="deleteProduct(${p.id})">ลบ</button></td>
        </tr>
      `).join('');
    }

    // ระบบเพิ่มสินค้า
    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('p-name').value;
      const price = document.getElementById('p-price').value;
      const img = document.getElementById('p-img').value || "https://via.placeholder.com/300x180/333333/ffffff?text=No+Image";

      const newProduct = {
        id: Date.now(),
        name: name,
        price: Number(price),
        img: img
      };

      products.push(newProduct);
      saveProducts();
      renderProducts();
      e.target.reset();
      alert('เพิ่มสินค้าเรียบร้อยแล้ว!');
    });

    // ระบบลบสินค้า
    function deleteProduct(id) {
      if (confirm('ยืนยันการลบสินค้านี้?')) {
        products = products.filter(p => p.id !== id);
        saveProducts();
        renderProducts();
      }
    }

    // เริ่มต้นแสดงผล
    renderProducts();
  </script>
</body>
</html>
